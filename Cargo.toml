[package]
name = "openhub"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Manage the devices connected to your Linux system"
repository = "https://github.com/CJTS15/openhub"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["gnome_46"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
