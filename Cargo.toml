[package]
name = "openhub"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Manage the devices connected to your Linux system"
repository = "https://github.com/CJTS15/openhub"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["gnome_46"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
zbus = { version = "5.13.2", default-features = false, features = ["async-io"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
futures-channel = "0.3"
libpulse-binding = "2.30.1"
libpulse-glib-binding = "2.29.0"
pipewire = "0.10.1"
rustix = { version = "1.1.5", features = ["event"] }
serde_json = "1.0.140"

[dev-dependencies]
# A fake ratbagd in the tests talks to the client over a socket pair.
zbus = { version = "5.13.2", default-features = false, features = ["async-io", "p2p"] }

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
