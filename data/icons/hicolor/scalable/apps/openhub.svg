<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="c2-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#363a4f" />
      <stop offset="100%" stop-color="#24273a" />
    </linearGradient>
    <linearGradient id="c2-switch-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c6a0f6" />
      <stop offset="100%" stop-color="#8aadf4" />
    </linearGradient>
    <filter id="c2-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="14" y="14" width="100" height="100" rx="26" fill="url(#c2-bg)" stroke="#494d64" stroke-width="2" filter="url(#c2-shadow)"/>

  <!-- Peripheral Ring Orbit Lines -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#8bd5ca" stroke-width="3" stroke-dasharray="25 15 30 10"/>

  <!-- Satellite Peripheral Status Dots -->
  <circle cx="64" cy="28" r="5" fill="#f5a97f"/> <!-- Power -->
  <circle cx="100" cy="64" r="5" fill="#8aadf4"/> <!-- Bluetooth -->
  <circle cx="64" cy="100" r="5" fill="#a6da95"/> <!-- Mouse/KB -->
  <circle cx="28" cy="64" r="5" fill="#ee99a0"/> <!-- Audio -->

  <!-- Central Floating Master Control Switch Box -->
  <g filter="url(#c2-shadow)">
    <rect x="40" y="44" width="48" height="40" rx="12" fill="#1e2030" stroke="#494d64" stroke-width="1.5"/>
    
    <!-- Active Toggle Track -->
    <rect x="46" y="56" width="36" height="16" rx="8" fill="url(#c2-switch-grad)"/>
    
    <!-- Switch Knob (On State) -->
    <circle cx="70" cy="64" r="6" fill="#cad3f5"/>
  </g>

  <!-- Connection Link Indicator Overlay -->
  <path d="M 64 28 L 64 44" stroke="#f5a97f" stroke-width="2" stroke-dasharray="2 2"/>
  <path d="M 88 64 L 100 64" stroke="#8aadf4" stroke-width="2" stroke-dasharray="2 2"/>
</svg>