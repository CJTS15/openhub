<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Tile: Surface 1 face on a Surface 0 base, with a faint Lavender edge for dark backgrounds -->
  <rect x="12" y="20" width="104" height="96" rx="20" fill="#313244"/>
  <rect x="12" y="12" width="104" height="96" rx="20" fill="#45475a"/>
  <rect x="12" y="12" width="104" height="96" rx="20" fill="url(#shine)"/>
  <rect x="12.75" y="12.75" width="102.5" height="94.5" rx="19.25" fill="none" stroke="#b4befe" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- The open ring (the "O"), open toward the mouse, around the hub -->
  <path d="M 88.9 52.4 A 26 26 0 1 1 71.6 35.1" fill="none" stroke="#b4befe" stroke-width="10" stroke-linecap="round"/>
  <circle cx="64" cy="60" r="9" fill="#cba6f7"/>
  <!-- Mouse (Peach), in the ring's opening -->
  <rect x="88" y="19" width="15" height="22" rx="7.5" fill="#fab387"/>
  <line x1="95.5" y1="22.5" x2="95.5" y2="28" stroke="#1e1e2e" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Keyboard key (Green) -->
  <rect x="24" y="20" width="19" height="19" rx="4.5" fill="#a6e3a1"/>
  <rect x="27.5" y="23" width="12" height="11" rx="2.5" fill="#ffffff" opacity="0.35"/>
  <!-- Headphones (Pink) -->
  <path d="M 25 93 a 8 8 0 0 1 16 0" fill="none" stroke="#f5c2e7" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="23" y="91" width="6" height="10" rx="2.5" fill="#f5c2e7"/>
  <rect x="37" y="91" width="6" height="10" rx="2.5" fill="#f5c2e7"/>
  <!-- Battery (Yellow) -->
  <rect x="85" y="85" width="18" height="12" rx="3" fill="#f9e2af"/>
  <rect x="103" y="88.5" width="2.5" height="5" rx="1" fill="#f9e2af"/>
  <rect x="88" y="88" width="8" height="6" rx="1.5" fill="#1e1e2e" opacity="0.5"/>
</svg>
